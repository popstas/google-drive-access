lang: "en"

# Logging configuration
# Available levels: DEBUG, INFO, WARNING, ERROR, CRITICAL
logLevel: "INFO"

google:
  # Service-account or authorized-user OAuth JSON.
  credentials_file: "data/service-account.json"
  # delegated_user: "admin@company.com"

drive:
  id: "YOUR_DRIVE_ID"
  root_folder_id: "ROOT_FOLDER_ID"  # Defaults to drive_id if set to "ROOT_FOLDER_ID"
  root_folder_name: "Clients"
  writer_subdir: ""   # subfolder to grant writer access via /set_client_subfolder_writer

scan:
  include_trashed: false
  include_shortcuts: true
  collect_permissions: true
  collect_permissions_max_level: null  # null = all depths; N = only depths <= N (1 = client folders only)
  max_depth: null
  public_subdir: "public"

cache_timeouts:
  list_folder_children: 3600  # seconds

compare:
  ignore_public_subdir: false  # If true, ignore public_subdir folder itself, but not its children
  normalize_file_names: false  # If true, normalize file/folder names by replacing forbidden characters with '_'
  ignore_format_differences: false  # If true, ignore format mismatches in comparison (same file, different format)
  ignore_duplicate_suffixes: false  # If true, ignore duplicate suffixes like (1), (2), etc. in file names
  ignore_folders: []  # List of folder names to ignore (only folders with children are ignored)
  ignore_empty_folders: false  # If true, ignore empty folders (folders containing no files) in comparisons

commands:
  move_files_to_public_folder:
    file_match:
      - ".*?KP.*?"
      - "^Public Report\\.csv$"
    mimeType_match:
      - "application/vnd.google-apps.spreadsheet"
      - "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
  move_files_csv:
    csv_file: "data/move_files.csv"
  moderate_delete:
    sheet_id: "<GOOGLE_SHEET_ID>"             # Google Sheet for pending/deleted tabs
    name_marker: "+delete"                     # case-insensitive token; +deleted does not match
    scan_roots: ["<FOLDER_ID>"]                # only descendants of these folders; empty uses drive.root_folder_id
    scan_interval_seconds: 300                 # interval used by `moderate_delete watch`
    max_per_run: 200                           # safety cap on deletions per apply run
    report_csv: "deletions-report.csv"         # CSV report written to output.dir
    allow_folder_delete: false                 # folders are queued but cannot be trashed unless explicitly enabled
    use_activity_api: false                    # resolve who renamed the item and when
    allowed_renamer_domains:                   # optional exact domain allow-list; empty/missing allows everyone
      - "example.com"
    # Rename audit / strict mode requires Cloud setup:
    #   - enable Drive Activity API + People API in the Google Cloud project
    #   - service account: grant drive.activity.readonly + directory.readonly
    #     and configure domain-wide delegation through `delegated_user`
    #   - authorized user: grant drive.activity.readonly + userinfo email/profile;
    #     do not configure `delegated_user`
    # When allowed_renamer_domains is non-empty, only matching renamer email
    # domains are accepted. Unresolved/external renamers are excluded during scan
    # and revalidated again immediately before apply.

output:
  dir: "./data"
  yaml_file: "drive_audit.yml"
  files_csv: "files.csv"
  permissions_csv: "permissions.csv"

planfix:
  getChildTasks:
    url: https://api.example.com/tasks
    token: skldjfh
  getManager:
    url: https://api.example.com/manager
    token: skldjfh
  getClientTask:
    url: https://api.example.com/client-task
    token: skldjfh
  role: "writer"
  timeout: 120  # Request timeout in seconds

share_file:
  days: 90   # 0 - never expire
  role: commenter

http:
  port: 7587
  token: skldjfh



