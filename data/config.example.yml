lang: "en"

# Logging configuration
# Available levels: DEBUG, INFO, WARNING, ERROR, CRITICAL
logLevel: "INFO"

google:
  credentials_file: "data/service-account.json"
  # delegated_user: "admin@company.com"

drive:
  id: "YOUR_DRIVE_ID"
  root_folder_id: "ROOT_FOLDER_ID"  # Defaults to drive_id if set to "ROOT_FOLDER_ID"
  root_folder_name: "Clients"

scan:
  include_trashed: false
  include_shortcuts: true
  max_depth: null
  public_subdir: "public"

cache_timeouts:
  list_folder_children: 3600  # seconds

commands:
  move_files_to_public_folder:
    file_match:
      - ".*?KP.*?"
      - "^Public Report\\.csv$"
    mimeType_match:
      - "application/vnd.google-apps.spreadsheet"
      - "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
  move_files_csv:
    csv_file: "data/move_files.csv"

output:
  dir: "./data"
  yaml_file: "drive_audit.yml"
  files_csv: "files.csv"
  permissions_csv: "permissions.csv"

planfix:
  getChildTasks:
    url: https://api.example.com/tasks
    token: skldjfh
  getManager:
    url: https://api.example.com/manager
    token: skldjfh
  getClientTask:
    url: https://api.example.com/client-task
    token: skldjfh
  role: "writer"

http:
  port: 7587
  token: skldjfh



