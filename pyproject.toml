[project]
name = "drive_audit"
version = "0.1.0"
description = "Google Drive Audit CLI"
requires-python = ">=3.11"
dependencies = [
    "google-auth",
    "google-auth-httplib2",
    "google-api-python-client",
    "loguru",
    "PyYAML",
    "python-dotenv",
    "requests",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "coveralls",
]
dev = [
    "black",
    "isort",
    "pre-commit",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["drive_audit"]
